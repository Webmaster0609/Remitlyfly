name: Deploy RemitlyFly Supabase Edge Function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/afrirate/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-afrirate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-afrirate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: yzjktqrmgdatdyvcpapa
    steps:
      - name: Check required secret
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy AfriRate function
        run: supabase functions deploy afrirate --project-ref "$SUPABASE_PROJECT_ID" --yes
      - name: Smoke test Kenya USD reference rate
        shell: bash
        run: |
          ANON_KEY=$(python3 - <<'PY'
          import re
          html = open("index.html", encoding="utf-8").read()
          match = re.search(r"const SUPABASE_ANON_KEY = ['\"]([^'\"]+)['\"]", html)
          if not match:
              raise SystemExit("Could not read the public Supabase key from index.html")
          print(match.group(1))
          PY
          )
          CODE=$(curl -sS -o /tmp/afrirate-response.json -w "%{http_code}" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "Accept: application/json" \
            "https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/afrirate?country=KE&base=USD")
          echo "HTTP status: $CODE"
          cat /tmp/afrirate-response.json
          test "$CODE" = "200"
