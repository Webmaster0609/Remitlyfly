name: Deploy RemitlyFly Supabase Edge Function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/afrirate/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-afrirate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-afrirate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: yzjktqrmgdatdyvcpapa
    steps:
      - name: Check required secret
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy AfriRate function
        run: supabase functions deploy afrirate --project-ref "$SUPABASE_PROJECT_ID" --yes
      - name: Verify all nine AfriRate currency pairs
        shell: bash
        run: |
          ANON_KEY=$(python3 - <<'PY'
          import re
          html = open("index.html", encoding="utf-8").read()
          match = re.search(r"""const SUPABASE_ANON_KEY = ['"]([^'"]+)['"]""", html)
          if not match:
              raise SystemExit("Could not read the public Supabase key from index.html")
          print(match.group(1))
          PY
          )
          for COUNTRY_PAIR in "KE KES" "NG NGN" "UG UGX"; do
            read -r COUNTRY QUOTE <<< "$COUNTRY_PAIR"
            for BASE in USD EUR GBP; do
              echo "Verifying $BASE->$QUOTE ($COUNTRY)"
              URL="https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/afrirate?country=$COUNTRY&base=$BASE"
              CODE=$(curl -sS -o /tmp/afrirate-response.json -w "%{http_code}" -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" -H "Accept: application/json" "$URL")
              echo "HTTP status: $CODE"
              if [ "$CODE" != "200" ]; then
                cat /tmp/afrirate-response.json
                echo "FAIL: endpoint did not return HTTP 200 for $BASE->$QUOTE ($COUNTRY)"
                exit 1
              fi
              python3 - "$COUNTRY" "$BASE" "$QUOTE" <<'PY'
          import json, sys
          country, base, quote = sys.argv[1:4]
          with open("/tmp/afrirate-response.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data.get("country") == country, f"country mismatch: {data}"
          assert data.get("base") == base, f"base mismatch: {data}"
          assert data.get("quote") == quote, f"quote mismatch: {data}"
          assert isinstance(data.get("rate"), (int, float)) and data["rate"] > 0, f"missing/invalid rate: {data}"
          assert data.get("indicativeOnly") is True, f"not marked indicative: {data}"
          assert data.get("stale") is False, f"rate is stale or freshness unknown: {data}"
          assert data.get("source"), f"missing source: {data}"
          assert data.get("date") or data.get("updatedAt"), f"missing rate date/time: {data}"
          print(f"PASS: 1 {base} = {data['rate']} {quote}; source={data['source']}; date={data.get('date')}; updatedAt={data.get('updatedAt')}; stale={data.get('stale')}; indicativeOnly=true")
          PY
            done
          done

      - name: Verify Tanzania and South Africa USD reference rates; report other bases honestly
        shell: bash
        run: |
          ANON_KEY=$(python3 - <<'PY'
          import re
          html = open("index.html", encoding="utf-8").read()
          match = re.search(r"""const SUPABASE_ANON_KEY = ['"]([^'"]+)['"]""", html)
          if not match:
              raise SystemExit("Could not read the public Supabase key from index.html")
          print(match.group(1))
          PY
          )
          for COUNTRY_PAIR in "TZ TZS" "ZA ZAR"; do
            read -r COUNTRY QUOTE <<< "$COUNTRY_PAIR"
            for BASE in USD EUR GBP; do
              echo "Checking $BASE->$QUOTE ($COUNTRY)"
              URL="https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/afrirate?country=$COUNTRY&base=$BASE"
              CODE=$(curl -sS -o /tmp/afrirate-response.json -w "%{http_code}" -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" -H "Accept: application/json" "$URL")
              python3 - "$COUNTRY" "$BASE" "$QUOTE" "$CODE" <<'PY'
          import json, sys
          country, base, quote, code = sys.argv[1:5]
          try:
              with open("/tmp/afrirate-response.json", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception:
              data = {}
          ready = (
              code == "200"
              and data.get("country") == country
              and data.get("base") == base
              and data.get("quote") == quote
              and isinstance(data.get("rate"), (int, float))
              and data["rate"] > 0
              and data.get("indicativeOnly") is True
              and data.get("stale") is False
              and bool(data.get("source"))
              and bool(data.get("rateDate") or data.get("updatedAt"))
          )
          if ready:
              print(f"PASS: 1 {base} = {data['rate']} {quote}; source={data['source']}; rateDate={data.get('rateDate')}; updatedAt={data.get('updatedAt')}; indicativeOnly=true")
          elif base == "USD":
              print(f"FAIL: required USD->{quote} ({country}) is unavailable or stale; HTTP {code}; reason={data.get('error', 'rate missing, stale, or incomplete')}")
              raise SystemExit(1)
          else:
              print(f"NOT AVAILABLE: {base}->{quote} ({country}); HTTP {code}. No estimate will be shown unless AfriRate publishes this exact pair.")
          PY
            done
          done
