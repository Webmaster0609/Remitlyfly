name: Deploy RemitlyFly Supabase Edge Function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/afrirate/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-afrirate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-afrirate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: yzjktqrmgdatdyvcpapa
    steps:
      - name: Check required secret
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy AfriRate function
        run: supabase functions deploy afrirate --project-ref "$SUPABASE_PROJECT_ID" --yes
      - name: Smoke test Kenya, Nigeria, and Uganda USD reference rates
        shell: bash
        run: |
          ANON_KEY=$(python3 - <<'PY'
          import re
          html = open("index.html", encoding="utf-8").read()
          match = re.search(r"""const SUPABASE_ANON_KEY = ['"]([^'"]+)['"]""", html)
          if not match:
              raise SystemExit("Could not read the public Supabase key from index.html")
          print(match.group(1))
          PY
          )
          for PAIR in "KE KES" "NG NGN" "UG UGX"; do
            read -r COUNTRY QUOTE <<< "$PAIR"
            echo "Testing $COUNTRY USD->$QUOTE"
            URL="https://$SUPABASE_PROJECT_ID.supabase.co/functions/v1/afrirate?country=$COUNTRY&base=USD"
            CODE=$(curl -sS -o /tmp/afrirate-response.json -w "%{http_code}" -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" -H "Accept: application/json" "$URL")
            echo "HTTP status: $CODE"
            cat /tmp/afrirate-response.json
            test "$CODE" = "200"
            python3 - "$COUNTRY" "$QUOTE" <<'PY'
          import json, sys
          country, quote = sys.argv[1:3]
          with open("/tmp/afrirate-response.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data.get("country") == country, data
          assert data.get("quote") == quote, data
          assert isinstance(data.get("rate"), (int, float)) and data["rate"] > 0, data
          assert data.get("indicativeOnly") is True, data
          print(f"PASS: 1 USD = {data['rate']} {quote} (indicative)")
          PY
          done
